# Model routing configuration for AI Staff HQ
# Maps specialist roles and departments to optimal models via OpenRouter.
# Lookup order: package-local config/model_routing.yaml (preferred), then CWD/config/model_routing.yaml, otherwise defaults.

# Role-based routing (takes precedence over department/default when configured)
role_routing: {}

# Department-based fallback routing
department_routing: {}

# Budget mode (use cheaper models across the board)
# WARNING: When enabled, budget mode overrides role-based/department routing
# and forces all specialists onto the budget model unless you pass a runtime
# model override.
budget_mode:
  enabled: false
  model: ""

# OpenRouter fallback chain: tried in order when the selected model is down,
# rate-limited, or retired. Ignored for direct OpenAI keys.
fallback_models:
  - "nvidia/nemotron-3-ultra-550b-a55b:free"
  - "google/gemma-4-31b-it:free"

# Model metadata (for display and validation)
available_models:
  - id: "nvidia/nemotron-3-super-120b-a12b:free"
    name: "Nemotron 3 Super 120B (free)"
    context_window: 262144
    cost_per_1k_input: 0.0
    strengths: ["reasoning", "tools", "structured-output", "free"]

  - id: "nvidia/nemotron-3-ultra-550b-a55b:free"
    name: "Nemotron 3 Ultra 550B (free)"
    context_window: 1000000
    cost_per_1k_input: 0.0
    strengths: ["reasoning", "long-context", "tools", "free"]

  - id: "google/gemma-4-31b-it:free"
    name: "Gemma 4 31B (free)"
    context_window: 262144
    cost_per_1k_input: 0.0
    strengths: ["writing", "tools", "free"]

  - id: "anthropic/claude-sonnet-5.5"
    name: "Claude Sonnet 5.5"
    context_window: 1000000
    cost_per_1k_input: 0.002
    strengths: ["reasoning", "code", "writing", "orchestration"]

  - id: "anthropic/claude-haiku-5.5"
    name: "Claude Haiku 5.5"
    context_window: 1000000
    cost_per_1k_input: 0.0001
    strengths: ["fast", "cheap", "structured-output"]
